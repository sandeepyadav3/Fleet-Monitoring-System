apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # Keep at 1 unless competing consumers are designed (prefetch, idempotency).
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq 5672; do echo waiting-rabbitmq; sleep 2; done
              until nc -z redis 6379; do echo waiting-redis; sleep 2; done
              until nc -z mongodb 27017; do echo waiting-mongo; sleep 2; done
      containers:
        - name: worker
          image: fleet/worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fleet-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
