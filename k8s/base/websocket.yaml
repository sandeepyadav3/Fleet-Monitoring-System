apiVersion: v1
kind: Service
metadata:
  name: websocket
  labels:
    app: websocket
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8000
  selector:
    app: websocket
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket
  template:
    metadata:
      labels:
        app: websocket
    spec:
      initContainers:
        - name: wait-redis
          image: busybox:1.36
          command:
            ["sh", "-c", "until nc -z redis 6379; do echo waiting; sleep 2; done"]
      containers:
        - name: websocket
          image: fleet/websocket:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fleet-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
